[tool.poetry]
name = "deepseek-local-rag-agent"
version = "0.1.0"
description = "DeepSeek Local RAG Agent with Ollama integration"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.27.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
langchain-core = "^0.2.0"
langchain-qdrant = "^0.1.0"
qdrant-client = "^1.6.4"
# agno 将通过 pip 单独安装
beautifulsoup4 = "^4.12.2"
pypdf = "^3.15.1"
pandas = "^2.0.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
jupyterlab = "^4.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "streamlit run deepseek_rag_agent.py" 