version: '3'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./etc/ollama:/etc/ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS_PATH=/root/.ollama/models
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    image: xwgy_cuda:12.8.0-devel-ubuntu22.04
    container_name: deepseek_rag_app
    ports:
      - "8501:8501"
      - "8888:8888"
    depends_on:
      - ollama
      - qdrant
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - JUPYTER_TOKEN=your_secret_token
      - NVIDIA_VISIBLE_DEVICES=all
      - APP_MODE=streamlit
    volumes:
      - .:/workspace
      - poetry_cache:/root/.cache/pypoetry
    restart: unless-stopped
    runtime: nvidia

volumes:
  ollama_data:
  qdrant_data:
  poetry_cache: 